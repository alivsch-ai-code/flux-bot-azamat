[phases.setup]
nixPkgs = ["nodejs", "python312", "gcc"]

[phases.install]
cmds = [
  "npm ci --prefix webapp-react",
  "python -m ensurepip --upgrade",
  "python -m pip install -r requirements.txt"
]

[phases.build]
cmds = [
  "npm run build --prefix webapp-react"
]

[start]
cmd = "python main.py"

