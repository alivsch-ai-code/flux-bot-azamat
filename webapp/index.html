<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AZAMAT AI Hub</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --tg-theme-bg-color: #1a1a2e;
      --tg-theme-text-color: #eee;
      --tg-theme-button-color: #6366f1;
      --tg-theme-button-text-color: #fff;
      --card-bg: rgba(255,255,255,0.08);
      --accent: #6366f1;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--tg-theme-bg-color);
      color: var(--tg-theme-text-color);
      min-height: 100vh;
      padding: 16px;
      padding-bottom: 24px;
    }
    .header {
      text-align: center;
      padding: 20px 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .header h1 { font-size: 1.4rem; font-weight: 700; }
    .header p { color: rgba(255,255,255,0.7); font-size: 0.85rem; margin-top: 6px; }
    .credits-badge {
      display: inline-flex; align-items: center; gap: 6px; margin-top: 10px;
      padding: 8px 14px; background: rgba(99,102,241,0.25); border-radius: 999px;
      font-size: 0.9rem; font-weight: 600; color: var(--accent);
    }
    .section { margin-top: 20px; }
    .section-title { font-size: 0.85rem; color: rgba(255,255,255,0.6); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s;
      border: 1px solid rgba(255,255,255,0.06);
      text-align: center;
    }
    .card:active { transform: scale(0.98); }
    .card:hover { background: rgba(255,255,255,0.12); }
    .card-icon { font-size: 2rem; margin-bottom: 8px; }
    .card-label { font-size: 0.9rem; font-weight: 600; }
    .card-desc { font-size: 0.75rem; color: rgba(255,255,255,0.5); margin-top: 4px; }
    .model-card {
      background: var(--card-bg);
      border-radius: 10px;
      padding: 12px 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .model-card:active { transform: scale(0.99); }
    .model-name { font-weight: 500; font-size: 0.95rem; }
    .model-cost { font-size: 0.8rem; color: var(--accent); }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 16px;
      background: rgba(255,255,255,0.1);
      border-radius: 8px;
      margin-bottom: 16px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .back-btn:active { opacity: 0.8; }
    .loading { text-align: center; padding: 40px; color: rgba(255,255,255,0.5); }
    .hidden { display: none !important; }
    .detail-view { padding: 0 4px; }
    .detail-preview { width: 100%; max-height: 200px; object-fit: contain; border-radius: 10px; margin: 12px 0; background: rgba(0,0,0,0.2); }
    .detail-desc { color: rgba(255,255,255,0.8); font-size: 0.9rem; line-height: 1.4; margin: 12px 0; }
    .detail-cost { color: var(--accent); font-weight: 600; margin: 12px 0; font-size: 1rem; }
    .detail-example { font-size: 0.8rem; color: rgba(255,255,255,0.5); font-style: italic; margin: 8px 0; }
    .btn-start { display: block; width: 100%; padding: 14px; margin: 16px 0 8px; background: var(--accent); color: var(--tg-theme-button-text-color); border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; text-align: center; }
    .btn-start:active { opacity: 0.9; }
    .btn-secondary { display: block; width: 100%; padding: 12px; margin: 8px 0; background: rgba(255,255,255,0.1); color: inherit; border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; font-size: 0.95rem; cursor: pointer; text-align: center; }
    .btn-secondary:active { opacity: 0.8; }
    .chat-mode-btns { display: flex; gap: 10px; margin-top: 16px; }
    .chat-mode-btns .btn-start { flex: 1; margin: 0; }
    .card-shop { grid-column: 1 / -1; display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 12px; text-align: left; padding: 18px 20px; }
    .card-shop .card-icon { margin-bottom: 0; font-size: 2.2rem; }
    .card-shop .card-desc { margin-top: 2px; margin-left: 0; }
  </style>
</head>
<body>
  <div id="app">
    <div id="main-view">
      <div class="header">
        <h1>🤖 AZAMAT AI Hub</h1>
        <p>Wähle eine Kategorie</p>
        <div class="credits-badge" id="credits-badge" style="display:none">💎 <span id="credits-count">0</span> Credits</div>
      </div>
      <div class="section">
        <div class="section-title">Kategorien</div>
        <div class="grid">
          <div class="card" data-action="nav_path_image">
            <div class="card-icon">🎨</div>
            <div class="card-label">Bild Studio</div>
            <div class="card-desc">Flux, DALL-E, SD</div>
          </div>
          <div class="card" data-action="nav_path_video">
            <div class="card-icon">🎬</div>
            <div class="card-label">Video Studio</div>
            <div class="card-desc">Kling, Wan, Hunyuan</div>
          </div>
          <div class="card" data-action="nav_path_audio">
            <div class="card-icon">🎙️</div>
            <div class="card-label">Audio Studio</div>
            <div class="card-desc">Music & Voice</div>
          </div>
          <div class="card" data-action="nav_path_text">
            <div class="card-icon">📝</div>
            <div class="card-label">Text / Chat</div>
            <div class="card-desc">LLMs & Chat</div>
          </div>
          <div class="card" data-action="nav_path_tools">
            <div class="card-icon">🛠️</div>
            <div class="card-label">Werkzeuge</div>
            <div class="card-desc">Profi-Tools</div>
          </div>
          <div class="card card-shop" data-action="cmd_shop">
            <div class="card-icon">💎</div>
            <div class="card-label">Credits kaufen</div>
            <div class="card-desc">Sicher per Telegram Stars</div>
          </div>
        </div>
      </div>
    </div>
    <div id="models-view" class="hidden">
      <div class="back-btn" id="back-btn">← Zurück</div>
      <div class="header">
        <h1 id="models-title">Modelle</h1>
      </div>
      <div id="models-list"></div>
    </div>
    <div id="detail-view" class="detail-view hidden">
      <div class="back-btn" id="detail-back-btn">← Zurück</div>
      <div id="detail-content"></div>
    </div>
  </div>
  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      document.documentElement.style.setProperty('--tg-theme-bg-color', tg.themeParams.bg_color || '#1a1a2e');
      document.documentElement.style.setProperty('--tg-theme-text-color', tg.themeParams.text_color || '#eee');
      document.documentElement.style.setProperty('--tg-theme-button-color', tg.themeParams.button_color || '#6366f1');
    }
    const API_BASE = window.location.origin;
    let currentPath = 'root';

    function loadUserCredits() {
      if (!tg?.initData) return;
      fetch(API_BASE + '/api/user_info', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ init_data: tg.initData })
      }).then(r => r.json()).then(res => {
        if (res.ok && res.credits != null) {
          const el = document.getElementById('credits-badge');
          const cnt = document.getElementById('credits-count');
          if (el && cnt) { el.style.display = 'inline-flex'; cnt.textContent = res.credits; }
        }
      }).catch(() => {});
    }
    loadUserCredits();

    function escapeHtml(s) {
      if (s == null || s === '') return '';
      const div = document.createElement('div');
      div.textContent = String(s);
      return div.innerHTML;
    }

    function initFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const view = params.get('view');
      if (view === 'shop') {
        sendAction('cmd_shop');
        return;
      }
      const path = params.get('path');
      if (path && path !== 'root') {
        fetch(API_BASE + '/api/models?path=' + encodeURIComponent(path))
          .then(r => r.json())
          .then(data => {
            const hasM = data.models && data.models.length > 0;
            const hasF = data.folders && data.folders.length > 0;
            if (hasM || hasF) {
              currentPath = path;
              showModels(path, data.models || [], data.title || path, data.folders || []);
            }
          })
          .catch(() => {});
      }
    }
    initFromUrl();

    function sendAction(action, payload = {}) {
      const payload2 = { action, ...payload };
      const hasInitData = tg?.initData;
      if (hasInitData) payload2.init_data = tg.initData;
      const noClose = action.startsWith('set_lang_');
      if (hasInitData) {
        fetch(API_BASE + '/api/webapp_action', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload2)
        }).then(r => r.json()).then(res => {
          if (res.ok && !noClose && tg?.close) tg.close();
          else if (!res.ok && !noClose) showError(res.error || 'Fehler');
        }).catch((err) => {
          if (!noClose) {
            if (tg?.sendData) tg.sendData(JSON.stringify({ action }));
            else if (tg?.close) tg.close();
            else showError('Verbindungsfehler');
          }
        });
      } else if (!noClose && tg?.sendData) {
        tg.sendData(JSON.stringify({ action }));
      } else if (!noClose && tg?.close) tg.close();
    }

    function showError(msg) {
      const el = document.createElement('div');
      el.style.cssText = 'position:fixed;bottom:20px;left:16px;right:16px;padding:12px;background:#c33;color:#fff;border-radius:8px;text-align:center;z-index:9999;';
      el.textContent = '⚠️ ' + msg + ' – Bitte im Chat /start nutzen.';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }

    document.querySelectorAll('.card[data-action]').forEach(card => {
      card.addEventListener('click', () => {
        const action = card.dataset.action;
        if (action.startsWith('nav_path_')) {
          const path = action.replace('nav_path_', '');
          fetch(API_BASE + '/api/models?path=' + encodeURIComponent(path))
            .then(r => r.json())
            .then(data => {
              const hasM = data.models && data.models.length > 0;
              const hasF = data.folders && data.folders.length > 0;
              if (hasM || hasF) {
                showModels(path, data.models || [], data.title || path, data.folders || []);
              } else {
                sendAction(action);
              }
            })
            .catch(() => sendAction(action));
        } else {
          sendAction(action);
        }
      });
    });

    function showModels(path, models, title, folders) {
      currentPath = path;
      document.getElementById('main-view').classList.add('hidden');
      document.getElementById('models-view').classList.remove('hidden');
      document.getElementById('models-title').textContent = title;
      const list = document.getElementById('models-list');
      const folderHtml = (folders || []).map(f => {
        const fp = f.path || f.slug;
        const label = escapeHtml((f.slug || fp).replace(/_/g, ' '));
        return `<div class="model-card folder-card" data-folder-path="${escapeHtml(fp)}" style="border-color: rgba(99,102,241,0.35);">
          <span class="model-name">📁 ${label}</span>
          <span class="model-cost">→</span>
        </div>`;
      }).join('');
      const modelHtml = models.map(m => `
        <div class="model-card" data-key="${escapeHtml(m.key)}">
          <span class="model-name">${escapeHtml(m.name)}</span>
          <span class="model-cost">${m.final_cost > 0 ? escapeHtml(String(m.final_cost)) + ' ⭐' : 'FREE'}</span>
        </div>
      `).join('');
      list.innerHTML = folderHtml + modelHtml;
      list.querySelectorAll('.model-card.folder-card').forEach(el => {
        el.addEventListener('click', () => {
          const fp = el.getAttribute('data-folder-path');
          if (!fp) return;
          fetch(API_BASE + '/api/models?path=' + encodeURIComponent(fp))
            .then(r => r.json())
            .then(data => {
              showModels(fp, data.models || [], data.title || fp, data.folders || []);
            })
            .catch(() => {});
        });
      });
      list.querySelectorAll('.model-card:not(.folder-card)').forEach(el => {
        el.addEventListener('click', () => {
          const key = el.getAttribute('data-key');
          if (key) showModelDetail(key);
        });
      });
    }

    function showModelDetail(key) {
      fetch(API_BASE + '/api/model?key=' + encodeURIComponent(key))
        .then(r => r.json())
        .then(data => {
          if (!data.ok) return;
          document.getElementById('main-view').classList.add('hidden');
          document.getElementById('models-view').classList.add('hidden');
          document.getElementById('detail-view').classList.remove('hidden');
          const isText = Array.isArray(data.model_type) && data.model_type.includes('text');
          const costLabel = data.final_cost <= 0 ? 'FREE' : data.final_cost + ' ⭐';
          let imgHtml = '';
          if (data.example_image_url) {
            imgHtml = `<img class="detail-preview" src="${escapeHtml(data.example_image_url)}" alt="Beispiel" onerror="this.style.display='none'">`;
          }
          const costHtml = `<div class="detail-cost">💰 Kosten: ${escapeHtml(String(data.final_cost))} Credits</div>`;
          let btnHtml = '';
          if (isText) {
            btnHtml = `<div class="chat-mode-btns">
              <button type="button" class="btn-start" data-action="chat_mode_yes_${escapeHtml(key)}">✅ Chat starten</button>
              <button type="button" class="btn-secondary" data-action="chat_mode_no_${escapeHtml(key)}">❌ Einmaliger Prompt</button>
            </div>`;
          } else {
            btnHtml = `<button type="button" class="btn-start" data-action="start_gen_${escapeHtml(key)}">🚀 Start (${costLabel})</button>`;
          }
          document.getElementById('detail-content').innerHTML = `
            <div class="header">
              <h1>🤖 ${escapeHtml(data.name || '')}</h1>
            </div>
            ${imgHtml}
            <div class="detail-desc">${escapeHtml(data.description || '')}</div>
            ${data.example_image_url ? '<div class="detail-example">🖼️ Dieses Modell hat ein Beispielbild oben in der Vorschau.</div>' : ''}
            ${costHtml}
            ${btnHtml}
          `;
          document.getElementById('detail-content').querySelectorAll('[data-action]').forEach(btn => {
            btn.addEventListener('click', (e) => {
              e.preventDefault();
              e.stopPropagation();
              const action = btn.getAttribute('data-action');
              if (!action) return;
              btn.disabled = true;
              if (btn.classList.contains('btn-start')) btn.textContent = '⏳ …';
              sendAction(action);
            });
          });
        })
        .catch(() => {});
    }

    function hideDetailView() {
      document.getElementById('detail-view').classList.add('hidden');
      document.getElementById('models-view').classList.remove('hidden');
    }

    document.getElementById('detail-back-btn').addEventListener('click', hideDetailView);

    document.getElementById('back-btn').addEventListener('click', () => {
      const parts = currentPath.split('/');
      if (parts.length > 1) {
        parts.pop();
        const parent = parts.join('/') || 'root';
        fetch(API_BASE + '/api/models?path=' + encodeURIComponent(parent))
          .then(r => r.json())
          .then(data => {
            currentPath = parent;
            if (parent === 'root') {
              document.getElementById('models-view').classList.add('hidden');
              document.getElementById('main-view').classList.remove('hidden');
            } else {
              showModels(parent, data.models || [], data.title || parent, data.folders || []);
            }
          })
          .catch(() => { document.getElementById('models-view').classList.add('hidden'); document.getElementById('main-view').classList.remove('hidden'); currentPath = 'root'; });
      } else {
        document.getElementById('models-view').classList.add('hidden');
        document.getElementById('main-view').classList.remove('hidden');
        currentPath = 'root';
      }
    });
  </script>
</body>
</html>
